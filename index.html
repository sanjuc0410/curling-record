<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>컬링 기량 기록부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 시트(sheet) 위 하우스 — 상단 고정 탭 바, 아래 카드형 작업면. 레이더 차트는 하우스 링 위에 그린다 */
:root{
  --bg:#EDF2F6; --card:#FFFFFF; --ink:#13253A; --muted:#5B6B7C; --line:#D5DFE7;
  --red:#C42334; --blue:#1F5AA6; --red-soft:#F7DEE1; --blue-soft:#DDE8F6;
  --h1:#E7EDF4; --h2:#C4D5EA; --h3:#92B1DA; --h4:#5884C1; --h5:#1F5AA6; --on-strong:#FFFFFF;
  --good:#1E7F4F; --bad:#B4372B; --warn-bg:#FFF4D6; --warn-ink:#7A5600; --stone-y:#E2B323; --fgz:#F3EBC9;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1721; --card:#15222F; --ink:#E5EDF5; --muted:#93A4B5; --line:#26384A;
  --red:#F0606C; --blue:#72A6EA; --red-soft:#3B1F26; --blue-soft:#1A2D45;
  --h1:#1B2938; --h2:#223F68; --h3:#2E5B95; --h4:#4A82C8; --h5:#7FB0F0; --on-strong:#0D1721;
  --good:#4CC38A; --bad:#F07A6E; --warn-bg:#3A2F12; --warn-ink:#F2D27A; --stone-y:#F2C94C; --fgz:#3A3420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1721; --card:#15222F; --ink:#E5EDF5; --muted:#93A4B5; --line:#26384A;
  --red:#F0606C; --blue:#72A6EA; --red-soft:#3B1F26; --blue-soft:#1A2D45;
  --h1:#1B2938; --h2:#223F68; --h3:#2E5B95; --h4:#4A82C8; --h5:#7FB0F0; --on-strong:#0D1721;
  --good:#4CC38A; --bad:#F07A6E; --warn-bg:#3A2F12; --warn-ink:#F2D27A; --stone-y:#F2C94C; --fgz:#3A3420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;letter-spacing:.5px}
.brand svg{flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.tab:hover{background:var(--bg);color:var(--ink)}
.tab[aria-current="true"]{background:var(--ink);color:var(--card)}
.teamsel{margin-left:auto;display:flex;align-items:center;gap:8px}
main{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-inline:16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:28px}
h2{font-family:var(--f-display);font-weight:400;font-size:21px}
h3{font-size:15px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-strong)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--card)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=text],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:72px;resize:vertical}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:24px}
.stat b{display:block;font-family:var(--f-num);font-size:22px;font-weight:500;color:var(--ink)}
.stat > span{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.l,th.l{text-align:left}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.heat{border-radius:6px;font-family:var(--f-num);font-size:13px;padding:5px 0;min-width:44px;display:inline-block}
.h0{background:transparent;color:var(--muted)}
.h1{background:var(--h1)} .h2{background:var(--h2)} .h3{background:var(--h3)}
.h4{background:var(--h4);color:var(--on-strong)} .h5{background:var(--h5);color:var(--on-strong)}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-weight:600}
.pill.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.pill.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;font-size:13px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.chart text{fill:var(--muted);font-family:var(--f-body)}
/* score stones */
.skill{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.skill-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
@media (max-width:560px){.item{grid-template-columns:minmax(0,1fr)}}
.item .cr{font-size:12.5px;color:var(--muted)}
.stones{display:flex;gap:6px;align-items:center}
.stone{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--f-num);font-size:13px;display:grid;place-items:center;padding:0;transition:transform .08s}
.stone:hover{border-color:var(--blue)}
.stone.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.stone.x{width:auto;border-radius:8px;padding:0 8px;font-family:var(--f-body);font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.stone:active{transform:scale(.92)}}
.lvl{font-size:12px;color:var(--muted);min-width:60px}
.list{display:grid;gap:0}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.date{font-family:var(--f-num);font-size:12.5px;color:var(--muted);white-space:nowrap}
.mini{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;min-width:0}
.mini .v{font-family:var(--f-num);font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20}
.edit-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.edit-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.sk-edit{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.it-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:6px}
@media (max-width:640px){.it-edit{grid-template-columns:minmax(0,1fr)}}
.w100{width:100%}
.it-edit{grid-template-columns:minmax(0,1fr) minmax(0,2fr) 80px 88px auto}
@media (max-width:640px){.it-edit{grid-template-columns:minmax(0,1fr) 64px 84px auto}.it-edit .crin{grid-column:1/-1;order:5}}
/* ---- mobile / tablet ---- */
@media (max-width:640px){
  body{font-size:15px}
  .top-in{gap:8px 12px;padding-block:8px}
  .brand{font-size:19px}
  .tabs{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}
  .tab{white-space:nowrap;padding:9px 12px}
  .card{padding:14px}
  h1{font-size:24px}
}
/* ---- evaluation session ---- */
.sess{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.sess{grid-template-columns:minmax(0,1fr)}.sess.has-p .plist{display:none}.sess:not(.has-p) .panel{display:none}}
@media (min-width:761px){.backbtn{display:none}}
.plist{display:grid;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.pbtn{display:grid;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:60px}
.pbtn:hover{border-color:var(--muted)}
.pbtn[aria-current="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.pbtn .nm{font-size:17px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.bar.done i{background:var(--good)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-current="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.done:not([aria-current="true"]){background:var(--blue-soft);color:var(--blue);border-color:transparent}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{width:46px;height:46px;border-radius:50%;border:2px dashed var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;font-family:var(--f-num);font-size:16px;padding:0;position:relative}
.slot.f{border-style:solid;border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.slot.sel{outline:3px solid var(--red);outline-offset:2px}
.slot small{position:absolute;bottom:-15px;font-size:9.5px;color:var(--muted);font-family:var(--f-body)}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.padb{border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:72px;cursor:pointer;display:grid;place-items:center;align-content:center;gap:2px;padding:6px 2px}
.padb b{font-family:var(--f-num);font-size:26px;font-weight:500;line-height:1}
.padb span{font-size:11.5px;color:var(--muted)}
.padb:hover{border-color:var(--red)}
@media (prefers-reduced-motion:no-preference){.padb:active{transform:scale(.95);background:var(--red-soft)}}
.toggle{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--card);text-align:left;width:100%}
.toggle .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:var(--card)}
.toggle[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.toggle[aria-pressed="true"] .box{background:var(--blue);border-color:var(--blue)}
.ns-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.step{display:flex;align-items:center;gap:4px}
.step button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.step input{width:52px;text-align:center;padding:7px 4px}
.save-st{font-size:12px;color:var(--muted)}
@media (max-width:560px){.ns-item{grid-template-columns:minmax(0,1fr)}.ns-item .step{justify-content:flex-end}.slot{width:42px;height:42px}}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sheet-card{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start;background:linear-gradient(to bottom,var(--blue-soft),var(--card) 46px)}
.sheet-card.empty-sheet{border-style:dashed;background:var(--card)}
.sheet-card .lt{font-family:var(--f-display);font-size:28px;line-height:1}
.sheet-sess{display:grid;gap:5px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 10px;cursor:pointer}
.sheet-sess:hover{border-color:var(--blue)}
.sheetb{display:grid;gap:2px;min-width:82px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
.sheetb b{font-family:var(--f-display);font-size:24px;font-weight:400;line-height:1.1}
.sheetb span{font-size:11.5px;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetb[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-strong)}
.sheetb[aria-pressed="true"] span{color:var(--on-strong);opacity:.85}
.flabel{font-size:13px;font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sheet-tag{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--blue);color:var(--on-strong);margin-right:10px;font-size:22px;vertical-align:middle}
@media (max-width:420px){.sheets{grid-template-columns:repeat(2,minmax(0,1fr))}.sheetb{min-width:0;flex:1 1 28%}}
.sync{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.sync[data-err="1"]{color:var(--bad);font-weight:600}
.banner.err{background:var(--red-soft);color:var(--red)}
.datenav input[type=date]{padding:5px 8px}
.sheet-card.filled{text-align:left;cursor:pointer;font:inherit;color:inherit;justify-items:start}
.sheet-card.filled:hover{border-color:var(--blue)}
.sheet-card.filled .bar{width:100%}
.items-s{font-size:12.5px;color:var(--ink);line-height:1.45}
table.grid{width:auto;min-width:100%}
table.grid th,table.grid td{padding:5px 6px;vertical-align:middle}
table.grid th{text-align:center}
table.grid th.l{text-align:left}
.grid th .sub{display:block}
.sb-wrap{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(min(88vw,340px),1fr);gap:12px;align-items:start;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;overscroll-behavior-x:contain}
.sb-wrap .sheet-block{scroll-snap-align:start;min-width:0}
.sb-wrap .cell{min-width:62px;padding:5px 6px}
.sb-wrap .grid th .ih{min-width:56px;max-width:90px}
.sb-jump{display:flex;gap:6px;flex-wrap:wrap}
main.wide{max-width:none}
.dg{display:block;border-radius:8px;flex:none;max-width:100%;height:auto}
.dg-edit{cursor:crosshair;touch-action:manipulation}
.dg-editor{grid-column:1/-1;border:1px dashed var(--blue);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.dg-wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dg-zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:4px}
.dg-zones input{width:100%}
.dg-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.dg-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;border:1px solid var(--ink)}
.kdg{display:flex;gap:12px;align-items:flex-start}
.kid-top{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.kt-left{flex:1 1 300px;min-width:0}
.kt-dg{display:grid;gap:10px;align-items:start;max-width:100%;overflow-x:auto;flex:0 0 auto}
.kdgc{margin:0;display:grid;gap:4px;justify-items:center;width:118px}
.kdgc figcaption{display:grid;gap:2px;text-align:center;font-size:12.5px;line-height:1.3}
.dg-note{display:inline-block;font-size:11.5px;color:var(--blue);background:var(--blue-soft);border-radius:6px;padding:2px 6px}
.kt-leg{grid-column:1/-1;justify-content:center}
/* 선수 모드: 선수 1명당 같은 폭(150px), 시트 칸은 선수 수만큼만 (늘어나지 않음) */
.sb-wrap.kid-wrap{grid-auto-columns:max-content;justify-content:start;scroll-snap-type:x mandatory}
.kid-wrap .sheet-block{min-width:0;width:max-content}
.kid-wrap .ktable{table-layout:fixed;width:calc(var(--n) * 150px + (var(--n) + 1) * 6px);min-width:0}
.kid-wrap .ktable th,.kid-wrap .ktable td.kc{width:150px}
.kid-wrap .ktable .kband td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
.kid-wrap .sb-head{flex-wrap:nowrap}
.kid-wrap .sb-team{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:calc(var(--n,2) * 150px - 40px)}
.kid-wrap .sb-head .sub{white-space:nowrap}
.kr-list{display:grid;gap:8px}
.kr-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card);cursor:pointer;font:inherit;color:inherit;text-align:left}
.kr-item:hover{border-color:var(--blue)}
.kr-item .grow{flex:1;min-width:0;display:grid}
.rk.big{width:42px;height:42px;font-size:19px;flex:none}
.kr-score{display:grid;gap:4px;justify-items:end;min-width:90px}
.kr-score b{font-size:22px}
.kr-bar{width:90px;height:8px;border-radius:4px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.kr-bar i{display:block;height:100%;background:var(--blue)}
.toprank{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.tr-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);cursor:pointer;font:inherit;color:inherit;text-align:left}
.tr-item:hover{border-color:var(--blue)}
.tr-item .grow{flex:1;min-width:0}
.rank-wrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.rank-wrap{grid-template-columns:minmax(0,1fr)}.rank-wrap>div{order:-1}}
.rk-list{display:grid;gap:6px;max-height:340px;overflow-y:auto;padding-right:2px}
.rk-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.rk-item.off .toggle{opacity:.6}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 10px;cursor:pointer;font:inherit;font-size:13px;font-family:var(--f-num)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-strong)}
.rank-tbl td{text-align:center}

<script>
(function(){
const DEFAULT_SKILLS=[

 {id:'shot',name:'다양한 샷 (드로우·테이크)',short:'샷',items:[

 {id:'swp',name:'스위핑 능력',short:'스위핑',items:[

 {id:'wgt',name:'웨이트 판단',short:'웨이트',items:[
  {id:'wgt1',name:'웨이트 존 콜',reps:5,criteria:'호그라인 통과 시 예상 정지 존(1~10)을 콜: 정확 5 · 1존 차이 4 · 2존 3 · 3존 2 · 그 이상 1 · 실패 0'},
  {id:'wgt2',name:'스플릿 타임 활용',reps:3,criteria:'백라인-호그 시간으로 웨이트를 판단하고 조정'},
  {id:'wgt3',name:'아이스 변화 반영',reps:1,criteria:'엔드 진행에 따른 아이스 속도 변화를 다음 투구에 반영'}]},
 {id:'read',name:'라인 읽기 (하우스 콜)',short:'콜',items:[
  {id:'read1',name:'컬 판단과 브룸 위치',reps:3,criteria:'아이스의 컬 양을 읽고 적절한 브룸 위치 제시'},
  {id:'read2',name:'라인 콜 타이밍',reps:3,criteria:'스톤 진행 중 스윕 지시를 적시에 정확히 함'},
  {id:'read3',name:'하우스 상황 전달',reps:1,criteria:'스톤 위치·거리를 팀원에게 명확히 전달'}]},
 {id:'tac',name:'전술 이해',short:'전술',items:[
  {id:'tac1',name:'샷 선택',reps:3,criteria:'점수·엔드·해머 유무를 고려한 샷 선택 (상황 문제 출제)'},
  {id:'tac2',name:'규칙 이해 (FGZ 등)',reps:1,criteria:'프리가드존(5스톤 룰) 등 규칙을 이해하고 활용'},
  {id:'tac3',name:'게임 플랜 이해',reps:1,criteria:'공격/수비 전환과 팀 전략을 스스로 설명할 수 있음'}]}
];
const LEVEL={0:'실패',1:'미흡',2:'노력 필요',3:'보통',4:'우수',5:'매우 우수'};
const POS=['리드','세컨드','서드','스킵','후보'];
const NOTE_CAT=['부상·통증','컨디션','기술','태도·멘탈','기타'];

const S={teams:[],players:[],records:[],notes:[],sessions:[],skills:clone(DEFAULT_SKILLS),loaded:false,
  tab:'eval',boardDate:today(),resDate:today(),resP:null,resS:null,memoDate:today(),memoFlagOnly:false,cell:false,showCrit:false,kidDone:false,kid:{on:lsGet('curling.kid')==='1',view:'enter'},teamId:null,playerId:null,skillDraft:null,confirm:null,
  sessId:null,evalP:null,evalItem:0,slot:null,newSess:null,drafts:{},timers:{},saving:{},dirty:{},saveState:'',
  db:null,user:null,uid:null,canWrite:true,offline:false,names:{},pending:false,noteForm:{cat:'기술',text:'',date:today()}};

function clone(o){return JSON.parse(JSON.stringify(o))}
function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtD(d){return d?d.replace(/-/g,'.'):'-'}
function shortD(d){return d?d.slice(5).replace('-','.'):''}
function f1(v){return v==null||isNaN(v)?'-':(Math.round(v*10)/10).toFixed(1)}
function avg(a){a=(a||[]).filter(v=>v!=null&&!isNaN(v));return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function r2(v){return v==null?null:Math.round(v*100)/100}
function heatCls(v){return v==null?'h0':'h'+Math.max(1,Math.min(5,Math.round(v)))}
const SCALES=[3,4,5];
const LEVELS={3:{0:'실패',1:'미흡',2:'보통',3:'우수'},4:{0:'실패',1:'미흡',2:'보통',3:'우수',4:'매우 우수'}};
const KID_LEVELS={3:{0:'다시 도전',1:'아쉬움',2:'보통',3:'잘함'},4:{0:'다시 도전',1:'아쉬움',2:'보통',3:'잘함',4:'최고'}};
function mx(it){const m=+(it&&it.max);return SCALES.includes(m)?m:5}
function conv(v,m,T){if(v==null||isNaN(v))return null;m=m||5;T=T||5;if(m===T)return v;return Math.min(T,Math.max(0,v*T/m))}
const scaleTxt=m=>`0~${m}점`;
const n5=(v,m)=>conv(v,m,5);
function sessScale(sess){const ms=[...new Set(sess.items.map(mx))];return ms.length===1?ms[0]:5}
function heatM(v,m){return heatCls(n5(v,m))}
function delta(v){if(v==null||isNaN(v))return '<span class="flat">–</span>';const r=Math.round(v*10)/10;
  if(r>0)return `<span class="up num">▲${r.toFixed(1)}</span>`;if(r<0)return `<span class="down num">▼${Math.abs(r).toFixed(1)}</span>`;return '<span class="flat num">0.0</span>'}
function toast(m){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- data helpers ---------- */
const teamPlayers=tid=>S.players.filter(p=>p.teamId===tid).sort((a,b)=>(POS.indexOf(a.position)-POS.indexOf(b.position))||a.name.localeCompare(b.name,'ko'));
const playerRecs=pid=>S.records.filter(r=>r.playerId===pid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||'')<(b.createdAt||'')?-1:1);
const teamOf=id=>S.teams.find(t=>t.id===id);
const playerOf=id=>S.players.find(p=>p.id===id);
const sessOf=id=>S.sessions.find(s=>s.id===id);
function recSkills(r){if(r._sk&&r._skv===r.updatedAt)return r._sk;const s=sessOf(r.sessionId);let o;
  if(!s)o=r.skillScores||{};else{const g={};s.items.forEach(it=>{const v=r.scores&&r.scores[it.itemId];if(v!=null)(g[it.skillId]=g[it.skillId]||[]).push(n5(v,mx(it)))});o={};Object.keys(g).forEach(k=>o[k]=avg(g[k]))}
  try{Object.defineProperty(r,'_sk',{value:o,configurable:true,writable:true});Object.defineProperty(r,'_skv',{value:r.updatedAt,configurable:true,writable:true})}catch(e){}return o}
function series(pid,sid){return playerRecs(pid).map(r=>({date:r.date,v:recSkills(r)[sid]})).filter(x=>x.v!=null)}
function profile(pid,which){const o={};S.skills.forEach(s=>{const se=series(pid,s.id);const x=which==='last'?se[se.length-1]:which==='prev'?se[se.length-2]:se[0];if(x)o[s.id]=x.v});return o}
function ovr(o){return o?avg(S.skills.map(s=>o[s.id])):null}
function profDelta(pid,base){ // base 'prev' | 'first'
  const d=[];S.skills.forEach(s=>{const se=series(pid,s.id);if(se.length<2)return;const b=base==='prev'?se[se.length-2]:se[0];d.push(se[se.length-1].v-b.v)});return d.length?avg(d):null}
function teamAvg(tid,which){const o={};const ps=teamPlayers(tid);const pr=ps.map(p=>profile(p.id,which));S.skills.forEach(s=>{const v=avg(pr.map(x=>x[s.id]));if(v!=null)o[s.id]=v});return o}
function recOverall(r){return r?avg(Object.values(recSkills(r))):null}

function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
const AKEY='curling.api.v1';
const IN_GAS=!!(window.google&&google.script&&google.script.run);
function apiUrl(){return lsGet(AKEY)||''}
async function gs(action,payload,pin){
  const body={pin:pin??S.pin,action,payload:payload||{}};
  if(IN_GAS)return new Promise((res,rej)=>{google.script.run.withSuccessHandler(r=>{if(r&&r.error)rej(r);else res(r)}).withFailureHandler(e=>rej({error:'network',message:String(e&&e.message||e)})).api(body.pin,action,body.payload)});
  const url=apiUrl();if(!url)throw {error:'noapi',message:'서버 주소(웹 앱 URL)를 먼저 입력하세요.'};
  let r;try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})}catch(e){throw {error:'network',message:'서버에 연결하지 못했습니다. 인터넷 연결이나 서버 주소를 확인하세요.'}}
  let j;try{j=await r.json()}catch(e){throw {error:'network',message:'서버 응답을 읽지 못했습니다. 서버 주소가 /exec 로 끝나는지, Code.gs를 새 버전으로 배포했는지 확인하세요.'}}
  if(j&&j.error)throw j;return j}
try{S.queue=JSON.parse(lsGet(QKEY)||'[]')||[]}catch(e){S.queue=[]}
function saveQueue(){lsSet(QKEY,JSON.stringify(S.queue))}
function applyLocal(op){
  if(op.a==='putSkills'){S.skills=clone(op.skills);return}
  if(op.a==='delMany'){op.items.forEach(x=>{const arr=S[x.col];if(!arr)return;const i=arr.findIndex(y=>y.id===x.id);if(i>=0)arr.splice(i,1)});return}
  const arr=S[op.col];if(!arr)return;const i=arr.findIndex(x=>x.id===op.id);
  if(op.a==='del'){if(i>=0)arr.splice(i,1);return}
  const v={...op.data,id:op.id};if(i>=0)arr[i]=v;else arr.push(v)}
const qkey=op=>op.a==='putSkills'?'skills':op.a==='delMany'?op.key:op.col+'/'+op.id;
function enqueue(op){S.queue=S.queue.filter(q=>qkey(q)!==qkey(op));S.queue.push(op);saveQueue();applyLocal(op);pump()}
async function pump(){
  if(S.pumping||!S.pin)return;S.pumping=true;paintSync();
  while(S.queue.length){const op=S.queue[0];
    try{await gs(op.a,op.a==='putSkills'?{skills:op.skills}:op.a==='delMany'?{items:op.items}:{col:op.col,id:op.id,data:op.data});
      S.queue=S.queue.filter(q=>q!==op);saveQueue();if(S.syncErr){S.syncErr=null;softRender()}S.lastSync=new Date();paintSync()}
    catch(e){
      if(e.error==='pin'||e.error==='nopin'||e.error==='locked'){S.pumping=false;authFail(e);return}
      if(e.error==='bad_action'&&op.a==='delMany'){const idx=S.queue.indexOf(op);S.queue.splice(idx,1,...op.items.map(x=>({a:'del',col:x.col,id:x.id})));saveQueue();continue}
      if(['bad_col','bad_id','bad_data','too_big','bad_action'].includes(e.error)){S.queue=S.queue.filter(q=>q!==op);saveQueue();toast(e.message);continue}
      const first=!S.syncErr;S.syncErr=e.message||'연결 실패';S.pumping=false;paintSync();if(first)softRender();setTimeout(pump,5000);return}}
  S.pumping=false;paintSync()}
async function put(col,id,data){enqueue({a:'put',col,id,data:{...data,updatedAt:new Date().toISOString()}});softRender();return true}
async function del(col,id){enqueue({a:'del',col,id});softRender();return true}
function delMany(items){if(!items.length)return;enqueue({a:'delMany',key:uid('m'),items});softRender()}
async function putSkills(skills){enqueue({a:'putSkills',skills:clone(skills)});return true}
function hm(d){return d?String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):''}
function syncText(){if(!S.pin)return '';if(S.syncErr)return `연결 끊김 · 대기 ${S.queue.length}건`;if(S.queue.length)return `저장 중 ${S.queue.length}건`;return S.lastSync?`동기화 ${hm(S.lastSync)}`:'동기화 중…'}
function paintSync(){const el=document.getElementById('syncSt');if(el){el.textContent=syncText();el.dataset.err=S.syncErr?'1':''}}
function applyLoad(d){
  ['teams','players','sessions','records','notes'].forEach(c=>S[c]=d[c]||[]);
  S.skills=d.skills&&d.skills.length?clone(d.skills):clone(DEFAULT_SKILLS);
  S.queue.forEach(applyLocal)}
async function refresh(force){
  if(!S.pin||(!force&&(S.queue.length||S.pumping||S.refreshing)))return;
  S.refreshing=true;
  try{const r=await gs('load');if(!S.queue.length||force)applyLoad(r.data);S.lastSync=new Date();if(S.syncErr)S.syncErr=null;
    const was=S.loaded;S.loaded=true;was?softRender():render()}
  catch(e){if(e.error==='pin'||e.error==='nopin'||e.error==='locked')authFail(e);else{S.syncErr=e.message;if(!S.loaded){S.loaded=true;render()}else softRender()}}
  finally{S.refreshing=false;paintSync()}}
function authFail(e){S.pin=null;lsSet(PKEY,null);S.loaded=false;S.authMsg=e.message||'다시 접속해 주세요.';render()}
function pinView(){return `<section class="card" style="max-width:420px;margin:24px auto;display:grid;gap:14px">
  <div><div class="eyebrow">코치 접속</div><h1>PIN을 입력하세요</h1><p class="sub" style="margin:4px 0 0">관리자에게 받은 코치 PIN을 입력하면 이 기기에서 계속 쓸 수 있습니다.</p></div>
  <form id="pinForm" class="row" style="align-items:flex-end">${IN_GAS?'':`<label class="f" style="flex-basis:100%">서버 주소 (Apps Script 웹 앱 URL)<input type="url" id="apiIn" value="${esc(apiUrl())}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>`}<label class="f" style="flex:1">코치 PIN<input type="password" id="pinIn" inputmode="numeric" autocomplete="current-password" style="font-size:20px;letter-spacing:.3em"></label>
  <button class="btn pri" type="submit" style="min-height:44px">접속</button></form>
  ${S.authMsg?`<p class="down" style="margin:0" role="alert">${esc(S.authMsg)}</p>`:''}</section>`}
async function login(pin){
  if(!pin){S.authMsg='PIN을 입력하세요';render();return}
  S.authMsg='확인 중…';render();
  try{const r=await gs('load',{},pin);S.pin=pin;lsSet(PKEY,pin);S.authMsg='';applyLoad(r.data);S.lastSync=new Date();S.loaded=true;render();pump()}
  catch(e){S.authMsg=e.message||'접속하지 못했습니다';render()}}
document.addEventListener('submit',e=>{if(e.target.id==='kidExitForm'){e.preventDefault();const v=(document.getElementById('kxPin')?.value||'').trim();if(v&&v===S.pin){flushAll();S.kid={on:false,view:'enter'};lsSet('curling.kid',null);S.sessId=null;S.evalP=null;S.tab='eval';render()}else{S.kid.exitMsg='PIN이 맞지 않습니다';render()}return}
  if(e.target.id==='pinForm'){e.preventDefault();const ai=document.getElementById('apiIn');if(ai){const u=ai.value.trim();if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u)){S.authMsg='서버 주소는 https://script.google.com/macros/s/…/exec 형식이어야 합니다';render();return}lsSet(AKEY,u||null)}login((document.getElementById('pinIn')?.value||'').trim())}});
function makeSample(){
  const t='sample_team',mk=(n,pos,i)=>({id:'sample_p'+i,name:n,pos});
  put('teams',t,{name:'예시팀 (샘플)',sample:true,createdAt:new Date().toISOString()});
  const ps=[mk('학생A','리드',1),mk('학생B','세컨드',2),mk('학생C','서드',3),mk('학생D','스킵',4)];
  ps.forEach(p=>put('players',p.id,{name:p.name,teamId:t,position:p.pos,sample:true,createdAt:new Date().toISOString()}));
  const pick=[];S.skills.forEach(s=>{if(s.items[0])pick.push({itemId:s.items[0].id,skillId:s.id,skillName:s.name,name:s.items[0].name,reps:3})});
  const dates=[-28,-14,0].map(o=>{const d=new Date();d.setDate(d.getDate()+o);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)});
  dates.forEach((dt,si)=>{const sid='sample_s'+(si+1);const sess={date:dt,teamId:t,sheet:'A',playerIds:ps.map(p=>p.id),title:`기초 기능 ${si+1}차 평가`,items:pick,sample:true,createdAt:new Date().toISOString()};
    put('sessions',sid,sess);
    ps.forEach((p,pi)=>{const att={},sc={},sk={};pick.forEach(it=>{const mu=2.3+pi*.4+si*.4;const a=[0,1,2].map(()=>Math.max(1,Math.min(5,Math.round(mu+(Math.random()-.5)*2))));att[it.itemId]=a;sc[it.itemId]=r2(avg(a));sk[it.skillId]=sc[it.itemId]});
      put('records',sid+'__'+p.id,{playerId:p.id,teamId:t,date:dt,sheet:'A',sessionId:sid,attempts:att,scores:sc,skillScores:sk,memo:'',sample:true,createdAt:new Date().toISOString(),by:null})})});
  S.teamId=t;toast('예시 데이터를 넣었습니다');render()}

/* ---------- session record drafts (auto-save) ---------- */
const recId=(sid,pid)=>sid+'__'+pid;
function getDraft(sess,pid){
  const id=recId(sess.id,pid);
  if(!S.drafts[id]){const r=S.records.find(x=>x.id===id);S.drafts[id]={attempts:clone(r?.attempts||{}),memo:r?.memo||'',flag:!!r?.flag,createdAt:r?.createdAt,by:r?.by,sample:r?.sample}}
  const d=S.drafts[id];sess.items.forEach(it=>{const a=d.attempts[it.itemId]||[];while(a.length<it.reps)a.push(null);d.attempts[it.itemId]=a.slice(0,it.reps)});
  return d}
function peekAttempts(sess,pid){const id=recId(sess.id,pid);return S.drafts[id]?.attempts||S.records.find(x=>x.id===id)?.attempts||{}}
function progress(sess,pid){const a=peekAttempts(sess,pid);let done=0,tot=0;sess.items.forEach(it=>{tot+=it.reps;done+=(a[it.itemId]||[]).slice(0,it.reps).filter(v=>v!=null).length});return {done,tot}}
function buildRec(sess,pid,d){
  const scores={},att={};sess.items.forEach(it=>{const a=(d.attempts[it.itemId]||[]).slice(0,it.reps);if(a.some(v=>v!=null)){att[it.itemId]=a;scores[it.itemId]=r2(avg(a))}});
  const sk={};const g={};sess.items.forEach(it=>{if(scores[it.itemId]!=null)(g[it.skillId]=g[it.skillId]||[]).push(n5(scores[it.itemId],mx(it)))});Object.keys(g).forEach(k=>sk[k]=r2(avg(g[k])));
  const doc={playerId:pid,teamId:playerOf(pid)?.teamId||sess.teamId,date:sess.date,sheet:sess.sheet||'',sessionId:sess.id,attempts:att,scores,skillScores:sk,memo:(d.memo||'').trim(),flag:!!d.flag,createdAt:d.createdAt||new Date().toISOString(),by:d.by||S.uid||null};
  if(d.sample)doc.sample=true;return doc}
function schedule(sess,pid){const id=recId(sess.id,pid);S.saveState='저장 대기';clearTimeout(S.timers[id]);S.timers[id]=setTimeout(()=>flush(sess.id,pid),700)}
async function flush(sid,pid){
  const id=recId(sid,pid);clearTimeout(S.timers[id]);delete S.timers[id];
  const sess=sessOf(sid);const d=S.drafts[id];if(!sess||!d)return;
  if(S.saving[id]){S.dirty[id]=true;return}
  S.saving[id]=true;S.saveState='저장 중…';paintSave();
  const doc=buildRec(sess,pid,d);const exists=S.records.some(x=>x.id===id);let ok=true;
  if(!Object.keys(doc.scores).length&&!doc.memo&&!doc.flag){if(exists)ok=await del('records',id)}else ok=await put('records',id,doc);
  if(ok)d.createdAt=doc.createdAt;
  S.saving[id]=false;S.saveState=ok?'저장됨':'저장 실패';paintSave();
  if(S.dirty[id]){S.dirty[id]=false;flush(sid,pid)}}
function flushAll(){Object.keys(S.timers).forEach(id=>{const [sid,pid]=id.split('__');flush(sid,pid)})}
function paintSave(){const el=document.getElementById('saveSt');if(el)el.textContent=S.saveState}

/* ---------- charts ---------- */
function radar(series,size){
  size=size||320;const sk=S.skills,n=sk.length;if(n<3)return '';
  const pad=62,cx=size/2+pad,cy=size/2+28,R=size/2-10,W=size+pad*2,H=size+56;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*(v/5),cy+Math.sin(ang(i))*R*(v/5)];
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="기능별 점수 레이더">`;
  g+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--blue-soft)"/><circle cx="${cx}" cy="${cy}" r="${R*.66}" fill="var(--card)"/><circle cx="${cx}" cy="${cy}" r="${R*.33}" fill="var(--red-soft)"/><circle cx="${cx}" cy="${cy}" r="${R*.1}" fill="var(--card)"/>`;
  for(let k=1;k<=5;k++)g+=`<circle cx="${cx}" cy="${cy}" r="${R*k/5}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  for(let k=1;k<=5;k++)g+=`<text x="${cx+3}" y="${cy-R*k/5+11}" font-size="9.5">${k}</text>`;
  sk.forEach((s,i)=>{const [x,y]=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const lx=cx+Math.cos(ang(i))*(R+14),ly=cy+Math.sin(ang(i))*(R+14);const c=Math.cos(ang(i));
    const anchor=Math.abs(c)<.2?'middle':c>0?'start':'end';
    g+=`<text x="${lx}" y="${ly+4}" text-anchor="${anchor}" font-size="12" style="fill:var(--ink)">${esc(s.short||s.name)}</text>`});
  series.forEach(se=>{if(!se.vals)return;if(!sk.some(s=>se.vals[s.id]!=null))return;
    const pts=sk.map((s,i)=>pt(i,se.vals[s.id]||0));
    g+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${se.color}" fill-opacity="${se.fill??.14}" stroke="${se.color}" stroke-width="${se.w||2}" ${se.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`;
    if(!se.dash)pts.forEach((p,i)=>{if(se.vals[sk[i].id]!=null)g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${se.color}"/>`})});
  return g+'</svg>'}
function legend(series){return '<div class="legend">'+series.filter(s=>s.vals&&Object.keys(s.vals).length).map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')+'</div>'}
function spark(pts,w,h){
  w=w||240;h=h||74;const l=18,r=10,t=8,b=18;const iw=w-l-r,ih=h-t-b;
  const y=v=>t+ih-(v/5)*ih;const x=i=>pts.length<2?l+iw/2:l+i*iw/(pts.length-1);
  let g=`<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img">`;
  [0,2.5,5].forEach(v=>{g+=`<line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+3.5}" font-size="9.5" text-anchor="end">${v}</text>`});
  const p=pts.map((d,i)=>[x(i),y(d.v)]);
  if(p.length>1){g+=`<path d="M${p.map(q=>q.join(',')).join('L')} L${p[p.length-1][0]},${t+ih} L${p[0][0]},${t+ih}Z" fill="var(--blue)" fill-opacity=".1"/>`;
    g+=`<polyline points="${p.map(q=>q.join(',')).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round"/>`}
  p.forEach((q,i)=>{const last=i===p.length-1;g+=`<circle cx="${q[0]}" cy="${q[1]}" r="${last?4:2.5}" fill="${last?'var(--red)':'var(--blue)'}"/>`});
  if(!pts.length)g+=`<text x="${w/2}" y="${h/2+4}" font-size="11" text-anchor="middle">기록 없음</text>`;
  if(pts.length){g+=`<text x="${x(0)}" y="${h-4}" font-size="9.5" text-anchor="${pts.length<2?'middle':'start'}">${shortD(pts[0].date)}</text>`;
    if(pts.length>1)g+=`<text x="${x(pts.length-1)}" y="${h-4}" font-size="9.5" text-anchor="end">${shortD(pts[pts.length-1].date)}</text>`}
  return g+'</svg>'}

   <section class="card"><h2>선수별 최근 점수</h2><p class="sub">행을 누르면 선수 분석으로 이동합니다. 변화는 직전 평가 대비 기능 평균입니다.</p>
   <div class="scroll"><table><thead><tr><th class="l">선수</th>${S.skills.map(s=>`<th title="${esc(s.name)}">${esc(s.short||s.name)}</th>`).join('')}<th>종합</th><th>변화</th></tr></thead><tbody>
   ${ps.map(p=>{const pr=profile(p.id,'last');
     return `<tr class="click" data-act="goplayer" data-v="${p.id}"><td class="l"><b>${esc(p.name)}</b> <span class="sub">${esc(p.position||'')}</span></td>
     ${S.skills.map(s=>`<td><span class="heat ${heatCls(pr[s.id])}">${f1(pr[s.id])}</span></td>`).join('')}
     <td class="num"><b>${f1(ovr(pr))}</b></td><td>${delta(profDelta(p.id,'prev'))}</td></tr>`}).join('')}
   </tbody></table></div></section></div>`;
  const notes=S.notes.filter(n=>ps.some(p=>p.id===n.playerId)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  h+=`<div class="grid2"><section class="card"><h2>최근 특이사항</h2>${notes.length?`<div class="list">${notes.map(n=>`<div class="li"><span class="date">${fmtD(n.date)}</span><div class="grow"><b>${esc(playerOf(n.playerId)?.name)}</b> <span class="pill ${n.cat==='부상·통증'?'red':''}">${esc(n.cat)}</span><div>${esc(n.text)}</div></div></div>`).join('')}</div>`:'<p class="sub">아직 입력된 특이사항이 없습니다. 선수 분석 화면에서 추가할 수 있습니다.</p>'}</section>
   <section class="card"><h2>최근 평가 세션</h2>${sessList(S.sessions.filter(s=>sessHasTeam(s,t.id)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5),true)}</section></div>`;
  return h}

const SHEETS=['A','B','C','D','E','F'];
const byPos=(a,b)=>(POS.indexOf(a.position)-POS.indexOf(b.position))||a.name.localeCompare(b.name,'ko');
function sessTeamIds(s){const ids=[...(s.teamIds&&s.teamIds.length?s.teamIds:[s.teamId])];(s.playerIds||[]).forEach(pid=>{const t=playerOf(pid)?.teamId;if(t&&!ids.includes(t))ids.push(t)});const ord=id=>{const k=S.teams.findIndex(t=>t.id===id);return k<0?99:k};return ids.filter(Boolean).sort((a,b)=>ord(a)-ord(b))}
function sessTeamName(s){return sessTeamIds(s).map(id=>teamOf(id)?.name).filter(Boolean).join(' · ')}
function sessHasTeam(s,tid){return sessTeamIds(s).includes(tid)}
function pSub(sess,p){return esc(p.position||'')+(sessTeamIds(sess).length>1?` · ${esc(teamOf(p.teamId)?.name||'')}`:'')}
function sessPlayers(sess){const ids=sess.playerIds;const order=sessTeamIds(sess);const ti=p=>{const k=order.indexOf(p.teamId);return k<0?99:k};return (ids&&ids.length?ids.map(playerOf).filter(Boolean):teamPlayers(sess.teamId)).sort((a,b)=>ti(a)-ti(b)||byPos(a,b))}
function sessProgress(sess){let d=0,t=0;sessPlayers(sess).forEach(p=>{const g=progress(sess,p.id);d+=g.done;t+=g.tot});return {done:d,tot:t,pct:t?Math.round(d/t*100):0}}
function sessTitle(s){return s.title||(s.sheet?`시트 ${s.sheet} 평가`:'평가')}
const houseIco=`<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="var(--blue)"/><circle cx="11" cy="11" r="6.8" fill="var(--card)"/><circle cx="11" cy="11" r="4" fill="var(--red)"/><circle cx="11" cy="11" r="1.4" fill="var(--card)"/></svg>`;

function sessList(list,compact){
  if(!list.length)return '<p class="sub">아직 평가 세션이 없습니다.</p>';
  return `<div class="list">${list.map(s=>{const recs=S.records.filter(r=>r.sessionId===s.id);const k='sess:'+s.id;const g=sessProgress(s);
   return `<div class="li"><span class="date">${fmtD(s.date)}</span><div class="grow">${s.sheet?`<span class="pill blue">시트 ${esc(s.sheet)}</span> `:''}<b>${esc(sessTitle(s))}</b>${s.sample?' <span class="pill">예시</span>':''}
   <div class="sub">${esc(sessTeamName(s))} · 선수 ${sessPlayers(s).length}명 · 항목 ${s.items.length}개 · 진행 ${g.pct}%</div></div>
   <div class="row"><button class="btn sm pri" data-act="opensess" data-v="${s.id}">열기</button>
   ${compact?'':`<button class="btn sm danger ${S.confirm===k?'armed':''}" data-act="delsess" data-v="${s.id}" ${S.canWrite?'':'disabled'}>${S.confirm===k?`삭제 확인 (기록 ${recs.length}건 포함)`:'삭제'}</button>`}</div></div>`}).join('')}</div>`}

function viewNewSess(){

   <div style="display:grid;gap:8px"><span class="flabel">② 팀 <span class="sub" style="font-weight:400">여러 팀을 함께 고를 수 있어요 (예: 남초 + 여초 + 여중)</span></span><div class="row">${S.teams.map(t=>{const on=tids.includes(t.id);return `<button class="chip" data-act="nsteamb" data-v="${t.id}" aria-current="${on}">${on?'✓ ':''}${esc(t.name)}</button>`}).join('')}</div></div>
   <div style="display:grid;gap:10px"><span class="flabel">③ 선수 <span class="num">${np}/${tps.length}</span>명 선택</span>
    ${tids.map(tid=>{const tp=teamPlayers(tid);const n=tp.filter(p=>N.playerIds[p.id]).length;return `<div style="display:grid;gap:6px"><div class="row between"><b>${esc(teamOf(tid)?.name||'')} <span class="sub num" style="font-weight:400">${n}/${tp.length}</span></b>${tp.length?`<button class="btn sm" data-act="nsallp" data-v="${tid}">${n===tp.length?'모두 해제':'모두 선택'}</button>`:''}</div>
     ${tp.length?`<div class="pgrid">${tp.map(p=>{const on=!!N.playerIds[p.id];const b=busy(p.id);return `<button class="toggle" data-act="nsp" data-v="${p.id}" aria-pressed="${on}"><span class="box">${on?'✓':''}</span><span><b>${esc(p.name)}</b> <span class="sub">${esc(p.position||'')}</span>${b.length?`<br><span class="sub">오늘 ${esc(b.join(', '))} 배정</span>`:''}</span></button>`}).join('')}</div>`:'<p class="sub" style="margin:0">이 팀에 선수가 없습니다. 설정에서 선수를 등록하세요.</p>'}</div>`}).join('')}</div>
   <div style="display:grid;gap:8px"><div class="row between"><span class="flabel">④ 평가 항목과 횟수</span>
    ${recent.length?`<select id="nsCopy" data-f="nscopy" aria-label="최근 평가에서 항목 불러오기"><option value="">최근 평가에서 항목 불러오기</option>${recent.map(s=>`<option value="${s.id}">${fmtD(s.date)} ${s.sheet?'시트 '+esc(s.sheet)+' · ':''}${esc(sessTeamName(s))} · ${esc(sessTitle(s))}</option>`).join('')}</select>`:''}</div>
    <p class="sub" style="margin:0">항목마다 오늘 몇 번 평가할지 정하세요. 매 회차를 0점부터 점수 범위(설정에서 항목별 0~3·0~4·0~5점) 안에서 매기고, 평균이 그 항목 점수가 됩니다.</p></div></section>`;
  S.skills.forEach(s=>{const all=s.items.every(i=>sel[i.id]!=null);
    h+=`<section class="card" style="display:grid;gap:8px"><div class="row between"><h2>${esc(s.name)}</h2><button class="btn sm" data-act="nsskill" data-v="${s.id}">${all?'모두 해제':'모두 선택'}</button></div>
    ${s.items.map(it=>{const on=sel[it.id]!=null;return `<div class="ns-item"><button class="toggle" data-act="nsitem" data-i="${it.id}" aria-pressed="${on}"><span class="box">${on?'✓':''}</span><span><b>${esc(it.name)}</b>${it.criteria?`<br><span class="sub">${esc(it.criteria)}</span>`:''}</span></button>
      ${on?`<div class="step" aria-label="횟수"><button data-act="nsrep" data-i="${it.id}" data-d="-1" aria-label="횟수 줄이기">−</button><input type="text" inputmode="numeric" id="rep_${it.id}" data-f="nsrepin" data-i="${it.id}" value="${sel[it.id]}"><span class="sub">회</span><button data-act="nsrep" data-i="${it.id}" data-d="1" aria-label="횟수 늘리기">+</button></div>`:'<span></span>'}</div>`}).join('')}</section>`});
  const ok=cnt&&np&&S.canWrite;
  h+=`<section class="card"><div class="row between"><span>${N.sheet?`시트 <b>${esc(N.sheet)}</b> · `:''}${esc(tids.map(t=>teamOf(t)?.name).filter(Boolean).join(' · '))} · 선수 <b class="num">${np}</b>명 · 항목 <b class="num">${cnt}</b>개 · 1인 <b class="num">${reps}</b>회</span>
   <div class="row"><button class="btn" data-act="nscancel">취소</button><button class="btn pri" data-act="nssave" ${ok?'':'disabled'}>${N.id?'설정 저장':'평가 시작'}</button></div></div>

const KID_LEVEL={0:'다시 도전',1:'아쉬움',2:'조금 아쉬움',3:'보통',4:'잘함',5:'최고'};
const flagIco=`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 15V2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3.9 2.5h8.6l-2 3.2 2 3.2H3.9z" fill="currentColor"/></svg>`;
function shiftDate(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
const WD='일월화수목금토';
function dayLabel(d){if(!d)return '';const x=new Date(d+'T00:00:00');return d.slice(5).replace('-','.')+'('+WD[x.getDay()]+')'}
function itemDef(id){return S.skills.flatMap(s=>s.items).find(i=>i.id===id)}
function itemsShort(s){return s.items.map(i=>`${esc(i.name)} ${i.reps}회`).join(' · ')}
function peekFlag(sess,pid){const id=recId(sess.id,pid);const d=S.drafts[id];if(d&&d.flag!=null)return !!d.flag;return !!S.records.find(r=>r.id===id)?.flag}
function dateNav(cur,act){
  const dates=[...new Set(S.sessions.map(s=>s.date))].sort().reverse().slice(0,6);
  return `<div class="row datenav"><button class="btn sm" data-act="${act}" data-v="${shiftDate(cur,-1)}" aria-label="이전 날짜">◀</button>
   <input type="date" id="dn_${act}" data-f="${act}" value="${cur}" aria-label="날짜"><button class="btn sm" data-act="${act}" data-v="${shiftDate(cur,1)}" aria-label="다음 날짜">▶</button>
   ${cur!==today()?`<button class="btn sm" data-act="${act}" data-v="${today()}">오늘</button>`:''}</div>
   ${dates.length?`<div class="chips" style="margin-top:8px">${dates.map(d=>`<button class="chip" data-act="${act}" data-v="${d}" aria-current="${d===cur}">${dayLabel(d)}</button>`).join('')}</div>`:''}`}

/* ---- 오늘 평가판: 모든 시트를 한 화면에 ---- */
function viewEval(){
  if(!S.teams.length)return noTeam();
  if(S.newSess)return viewNewSess();
  const D=S.boardDate;const ds=S.sessions.filter(s=>s.date===D).sort((a,b)=>(a.sheet||'Z').localeCompare(b.sheet||'Z'));
  const used=ds.map(s=>s.sheet);const free=SHEETS.filter(x=>!used.includes(x));
  let h=`<section class="card"><div class="row between"><div><div class="eyebrow">오늘 평가판</div><h1>${dayLabel(D)} 평가판</h1></div>
   <div class="row"><button class="btn sm" data-act="togglecrit" aria-pressed="${!!S.showCrit}">ⓘ 평가 기준</button><button class="btn" data-act="kidon">선수 모드</button></div></div>
   <div style="margin-top:10px">${dateNav(D,'bdate')}</div>
   <div class="row" style="margin-top:12px"><span class="sub">시트 추가</span>${free.map(sh=>`<button class="btn sm" data-act="newsess" data-v="${sh}">+ 시트 ${sh}</button>`).join('')}${free.length?'':'<span class="sub">A~F 모두 사용 중</span>'}</div></section>`;
  if(!ds.length)h+=`<div class="card empty"><h2>이 날짜에 만든 평가판이 없습니다</h2><p>위의 <b>+ 시트</b> 버튼으로 시트별 평가를 만드세요.</p></div>`;
  if(ds.length>1)h+=`<div class="sb-jump"><span class="sub" style="align-self:center">시트로 이동</span>${ds.map(s=>`<button class="chip" data-act="sbjump" data-v="${s.id}">${esc(s.sheet||'-')} · ${esc(sessTeamName(s))}</button>`).join('')}</div>`;
  if(ds.length)h+=`<div class="sb-wrap" id="sbWrap" data-k="board">${ds.map(sheetBlock).join('')}</div>`;
  const cs=curSess();
  if(S.cell&&cs&&cs.date===D&&sessPlayers(cs).some(p=>p.id===S.evalP))h+=`<div class="bsheet" role="dialog" aria-label="점수 입력">${scorePad(cs,false)}
   <div class="row between"><button class="btn sm" data-act="padclear">지우기</button><div class="row"><button class="btn sm" data-act="cellmove" data-v="-1">‹ 이전 칸</button><button class="btn sm" data-act="cellmove" data-v="1">다음 칸 ›</button><button class="btn sm pri" data-act="cellclose">닫기</button></div></div></div>`;
  return h}
function sheetHead(sess,tools){const g=sessProgress(sess);const k='sess:'+sess.id;
  return `<div class="sb-head"><div class="row" style="gap:10px;flex-wrap:nowrap;min-width:0">${sess.sheet?`<span class="sheet-tag" style="margin:0">${esc(sess.sheet)}</span>`:''}<div style="min-width:0"><b class="sb-team">${esc(sessTeamName(sess))}</b>${sess.title?` <span class="sub">${esc(sess.title)}</span>`:''}
    <div class="sub num">${tools?`진행 ${g.pct}% · ${g.done}/${g.tot}`:dayLabel(sess.date)}</div></div></div>
   ${tools?`<div class="row"><button class="btn sm" data-act="editsess" data-v="${sess.id}">설정</button><button class="btn sm danger ${S.confirm===k?'armed':''}" data-act="delsess" data-v="${sess.id}">${S.confirm===k?'삭제 확인':'삭제'}</button></div>`:''}</div>`}
function sheetBlock(sess){
  return `<section class="card sheet-block" id="sb_${sess.id}">${sheetHead(sess,true)}
   ${S.showCrit?`<div class="crit" style="margin:0 14px 10px">${sess.items.map(it=>{const df=itemDef(it.itemId);return `<div class="row" style="align-items:flex-start;flex-wrap:nowrap">${dgHas(df?.diagram)?diagramSVG(df.diagram,{w:70,lines:false}):''}<div><b>${esc(it.name)}</b> <span class="sub">${esc(df?.criteria||'')}</span>${df?.diagram?.note?` <span class="pill blue">${esc(df.diagram.note)}</span>`:''}</div></div>`}).join('')}</div>`:''}
   ${sheetGrid(sess,'input')}</section>`}
function sheetGrid(sess,mode){
  const ps=sessPlayers(sess);if(!ps.length)return '<p class="sub" style="padding:0 14px 14px">선수가 없습니다.</p>';
  const inp=mode==='input';
  return `<div class="scroll"><table class="grid"><thead><tr><th class="l stick">선수</th>${sess.items.map(it=>`<th><span class="ih">${esc(it.name)}</span><span class="sub num">${it.reps}회 · ${scaleTxt(mx(it))}</span></th>`).join('')}<th>평균${sessScale(sess)!==5?`<span class="sub num">/${sessScale(sess)}</span>`:''}</th></tr></thead><tbody>
  ${ps.map(p=>{const at=peekAttempts(sess,p.id);const fl=peekFlag(sess,p.id);const all=[];const T=sessScale(sess);
    const cells=sess.items.map((it,i)=>{const a=(at[it.itemId]||[]).slice(0,it.reps);while(a.length<it.reps)a.push(null);const av=avg(a);if(av!=null)all.push(conv(av,mx(it),T));
      if(!inp)return `<td><span class="heat ${heatM(av,mx(it))}">${f1(av)}</span></td>`;
      const cur=S.cell&&S.sessId===sess.id&&S.evalP===p.id&&S.evalItem===i;
      return `<td><button class="cell ${cur?'cur':''} ${a.every(v=>v!=null)?'full':''}" data-act="cell" data-s="${sess.id}" data-p="${p.id}" data-v="${i}" aria-label="${esc(p.name)} ${esc(it.name)} ${f1(av)}"><span class="dots">${a.map(v=>`<i class="${v!=null?'on':''}"></i>`).join('')}</span><span class="num">${f1(av)}</span></button></td>`}).join('');
    const nameCell=inp?`<div class="pn"><button class="flag ${fl?'on':''}" data-act="flag" data-s="${sess.id}" data-p="${p.id}" aria-pressed="${fl}" title="나중에 메모할 선수 표시" aria-label="${esc(p.name)} 메모 표시">${flagIco}</button><span><b>${esc(p.name)}</b><br><span class="sub">${pSub(sess,p)}</span></span></div>`
      :`<button class="namebtn" data-act="resp" data-s="${sess.id}" data-v="${p.id}"><b>${esc(p.name)}</b><span class="sub">${pSub(sess,p)} ›</span></button>`;
    return `<tr><td class="l stick">${nameCell}</td>${cells}<td><span class="heat ${heatM(avg(all),T)}">${f1(avg(all))}</span></td></tr>`}).join('')}
  </tbody></table></div>`}

/* ---- 순위·선발 ---- */
const RKEY='curling.rank.v2';
function rankState(){if(!S.rank){let o=null;try{o=JSON.parse(lsGet(RKEY)||'null')}catch(e){}
  if(!o){try{o=JSON.parse(lsGet('curling.rank.v1')||'null')}catch(e){}if(o)o.mode='auto'}
  S.rank=Object.assign({sess:{},w:{},team:'all',pos:'all',top:4,full:false,mode:'auto',aTeam:'all',aPos:'all'},o||{})}return S.rank}
function saveRank(){lsSet(RKEY,JSON.stringify(S.rank))}
function rankSessions(R){return S.sessions.filter(s=>R.team==='all'||sessHasTeam(s,R.team)).sort((a,b)=>b.date.localeCompare(a.date)||(a.sheet||'').localeCompare(b.sheet||''))}
function rankItems(R){const m=new Map();rankSessions(R).filter(s=>R.sess[s.id]).forEach(s=>s.items.forEach(it=>{if(!m.has(it.itemId))m.set(it.itemId,{id:it.itemId,name:it.name,skill:it.skillName||'',n:0});m.get(it.itemId).n++}));
  const order=S.skills.flatMap(s=>s.items.map(i=>i.id));return [...m.values()].sort((a,b)=>{const x=order.indexOf(a.id),y=order.indexOf(b.id);return (x<0?999:x)-(y<0?999:y)})}
const wOf=(R,id)=>R.w[id]==null?1:R.w[id];
function rec5(r,itemId){const v=r.scores&&r.scores[itemId];if(v==null)return null;const it=sessOf(r.sessionId)?.items.find(x=>x.itemId===itemId);return n5(v,mx(it))}
function rankMixed(R){return rankSessions(R).filter(s=>R.sess[s.id]).some(s=>s.items.some(it=>mx(it)!==5))}
function assignRanks(rows){const ok=rows.filter(r=>r.total!=null).sort((a,b)=>b.total-a.total||b.have-a.have||b.n-a.n||a.p.name.localeCompare(b.p.name,'ko'));
  let prev=null,rank=0;ok.forEach((r,i)=>{const t=Math.round(r.total*100);if(t!==prev){rank=i+1;prev=t}r.rank=rank});return ok}
function computeRank(R){
  const sids=new Set(rankSessions(R).filter(s=>R.sess[s.id]).map(s=>s.id));
  const items=rankItems(R).filter(i=>wOf(R,i.id)>0);
  let ps=(R.team==='all'?S.players:S.players.filter(p=>p.teamId===R.team)).filter(p=>R.pos==='all'||p.position===R.pos);
  const rows=ps.map(p=>{const recs=S.records.filter(r=>r.playerId===p.id&&sids.has(r.sessionId));
    const per={};let ws=0,wt=0,have=0;
    items.forEach(it=>{const v=avg(recs.map(r=>rec5(r,it.id)));per[it.id]=v;if(v!=null){have++;ws+=wOf(R,it.id)*v;wt+=wOf(R,it.id)}});
    return {p,per,total:wt?ws/wt:null,have,need:items.length,n:recs.length}});
  const ok=assignRanks(rows.filter(r=>!R.full||r.have===r.need));
  const out=rows.filter(r=>!ok.includes(r));
  return {items,ok,out,nSess:sids.size}}
/* 지금까지 모든 평가로 자동 종합 순위: 기능별 평균(5점 환산)의 평균 */
function autoRank(team,pos){
  const ps=(team==='all'?S.players:S.players.filter(p=>p.teamId===team)).filter(p=>pos==='all'||p.position===pos);
  const rows=ps.map(p=>{const recs=S.records.filter(r=>r.playerId===p.id&&sessOf(r.sessionId));const per={};
    S.skills.forEach(s=>{per[s.id]=avg(recs.map(r=>recSkills(r)[s.id]))});
    const vals=S.skills.map(s=>per[s.id]).filter(v=>v!=null);
    return {p,per,total:vals.length?avg(vals):null,have:vals.length,need:S.skills.length,n:recs.length,last:recs.reduce((m,r)=>r.date>m?r.date:m,'')}});
  const ok=assignRanks(rows);return {ok,out:rows.filter(r=>!ok.includes(r)),nSess:new Set(S.records.filter(r=>ok.some(o=>o.p.id===r.playerId)).map(r=>r.sessionId)).size}}
function rankModeBar(R){return `<div class="row" style="gap:6px"><button class="chip" data-act="rkmode" data-v="auto" aria-current="${R.mode!=='pick'}">종합 순위 (자동)</button><button class="chip" data-act="rkmode" data-v="pick" aria-current="${R.mode==='pick'}">선발 순위 (조건 선택)</button></div>`}

     ${res.ok.map((r,i)=>{const sel=top&&r.rank<=top;return `<tr class="${sel?'picked':''} ${top&&i===top-1?'cutline':''}"><td><span class="rk ${r.rank<=3?'r'+r.rank:''}">${r.rank}</span></td>

function rankTSV(mode){const R=rankState();
  if(mode==='auto'){const res=autoRank(R.aTeam,R.aPos);
    const head=['순위','선수','팀','포지션','종합(5점 환산)',...S.skills.map(s=>s.name),'평가 수','최근 평가'];
    return [head,...res.ok.map(r=>[r.rank,r.p.name,teamOf(r.p.teamId)?.name||'',r.p.position||'',f1(r.total),...S.skills.map(s=>f1(r.per[s.id])),r.n,r.last])].map(a=>a.join('\t')).join('\n')}
  const res=computeRank(R);const top=parseInt(R.top,10)||0;
  const head=['순위','선수','팀','포지션','종합(5점 환산)',...res.items.map(i=>i.name+(wOf(R,i.id)>1?' ×'+wOf(R,i.id):'')),'평가 수','선발'];
  const rows=res.ok.map(r=>[r.rank,r.p.name,teamOf(r.p.teamId)?.name||'',r.p.position||'',f1(r.total),...res.items.map(i=>f1(r.per[i.id])),r.n,top&&r.rank<=top?'선발':'']);
  return [head,...rows].map(a=>a.join('\t')).join('\n')}

function diagramSVG(dg,o){o=o||{};dg=dg||{};const z=dg.zones||{};const W=DG.W,cx=DG.cx,ty=DG.tee;
  const usesFgz=String(z.fgz??'')!==''||(dg.stones||[]).some(st=>st.y>ty+DG.r12-10);const H=(o.edit||usesFgz)?DG.H:ty+DG.r12+40;

  let g=`<svg class="dg ${o.edit?'dg-edit':''}" viewBox="0 0 ${W} ${H}" width="${o.w||140}" ${o.edit?`data-act="dgclick" data-si="${o.si}" data-ii="${o.ii}"`:''} role="img" aria-label="프리가드존과 하우스 그림">`;

  g+=`<line x1="${cx}" y1="0" x2="${cx}" y2="${H}" stroke="var(--muted)" stroke-width="2" stroke-opacity=".6"/><line x1="0" y1="${ty}" x2="${W}" y2="${ty}" stroke="var(--muted)" stroke-width="2" stroke-opacity=".6"/>`;
  if(H===DG.H)g+=`<line x1="0" y1="${H-4}" x2="${W}" y2="${H-4}" stroke="var(--red)" stroke-width="8"/>`;
  if(o.lines!==false){if(H===DG.H)g+=`<text x="${W-10}" y="${H-22}" text-anchor="end" font-size="26" style="fill:var(--muted)">호그라인</text>`;g+=`<text x="${W-10}" y="${ty+30}" text-anchor="end" font-size="26" style="fill:var(--muted)">티라인</text>`}

  (dg.stones||[]).forEach(st=>{const col=st.c==='g'?'var(--stone-y)':'var(--red)';
    g+=`<circle cx="${st.x}" cy="${st.y}" r="${DG.sr*1.25}" fill="${col}" stroke="var(--ink)" stroke-width="4"/><rect x="${st.x-8}" y="${st.y-3}" width="16" height="6" rx="3" fill="var(--card)"/>`;

   ${target<0?`<p class="sub" style="margin:0">${kid?'이 항목은 다 했어요. 고칠 회차를 누르거나 다른 항목을 골라요.':'모두 입력했습니다. 고칠 회차를 누르세요.'}</p>`:''}</div>`}

       <textarea id="rm_${id}" data-f="rmemo" data-s="${s.id}" data-p="${p.id}" placeholder="평가 메모 (예: 인턴에서 회전 부족)">${esc(memo)}</textarea>
       <div class="row"><select id="${nk}_c" aria-label="특이사항 분류">${NOTE_CAT.map(c=>`<option>${c}</option>`).join('')}</select><input type="text" id="${nk}_t" placeholder="특이사항 (부상, 컨디션 등)" style="flex:1;min-width:160px"><button class="btn sm" data-act="mnote" data-v="${nk}" data-p="${p.id}">특이사항 추가</button></div>

function viewKid(){

    ${dgs.length?`<div class="kt-dg" style="grid-template-columns:repeat(${dgs.length},118px)">${dgs.map(({it,df})=>`<figure class="kdgc">${diagramSVG(df.diagram,{w:112,lines:false,fs:46})}<figcaption><b>${esc(it.name)}</b>${df.diagram.note?`<span class="dg-note">${esc(df.diagram.note)}</span>`:''}</figcaption></figure>`).join('')}

function kidBoard(sess){

   <table class="ktable" style="--n:${ps.length}"><thead><tr>${ps.map(p=>{const at=peekAttempts(sess,p.id);const T=sessScale(sess);const ov=avg(sess.items.map(it=>conv(avg((at[it.itemId]||[]).slice(0,it.reps)),mx(it),T)));
      return `<th><div class="kname">${esc(p.name)}</div><div class="sub">${pSub(sess,p)}</div><span class="heat ${heatM(ov,T)}">${f1(ov)}</span></th>`}).join('')}</tr></thead>

function kidCell(sess,p,it){

function kidMine(p){

function itemDetail(pid){
  const rs=playerRecs(pid);const rows=[];
  S.skills.forEach(s=>s.items.forEach(it=>{const hit=rs.filter(r=>r.scores&&r.scores[it.id]!=null);if(!hit.length)return;const r=hit[hit.length-1],pr=hit[hit.length-2];
    rows.push(`<tr><td class="l"><span class="sub">${esc(s.short||s.name)}</span> ${esc(it.name)}</td><td class="date">${shortD(r.date)}</td><td class="num">${(r.attempts?.[it.id]||[]).map(v=>v??'·').join(' ')}</td><td><span class="heat ${heatM(r.scores[it.id],mx(sessOf(r.sessionId)?.items.find(x=>x.itemId===it.id)))}">${f1(r.scores[it.id])}</span></td><td>${pr?delta(r.scores[it.id]-pr.scores[it.id]):'<span class="flat">–</span>'}</td></tr>`)}));
  if(!rows.length)return '';
  return `<details style="margin-top:12px"><summary class="sub" style="cursor:pointer">세부 항목별 최근 결과 보기</summary><div class="scroll"><table style="margin-top:6px"><thead><tr><th class="l">세부 항목</th><th>날짜</th><th>회차 점수</th><th>평균</th><th>변화</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></details>`}

     <label class="f" style="flex:1;min-width:100px">차트 표시명<input type="text" class="w100" data-f="skshort" data-si="${si}" value="${esc(s.short||'')}"></label>

     <div class="it-edit sub" style="font-size:12px"><span>테스트 항목</span><span class="crin">평가 기준 / 방법</span><span>기본 횟수</span><span>점수 범위</span><span></span></div>
     ${s.items.map((it,ii)=>`<div class="it-edit"><input type="text" data-f="itname" data-si="${si}" data-ii="${ii}" value="${esc(it.name)}" placeholder="테스트 항목"><input type="text" class="crin" data-f="itcr" data-si="${si}" data-ii="${ii}" value="${esc(it.criteria||'')}" placeholder="평가 기준 / 방법"><input type="text" inputmode="numeric" data-f="itreps" data-si="${si}" data-ii="${ii}" value="${it.reps||1}" aria-label="기본 횟수"><select data-f="itmax" data-si="${si}" data-ii="${ii}" aria-label="평가 단계">${SCALES.map(m=>`<option value="${m}" ${mx(it)===m?'selected':''}>${scaleTxt(m)}</option>`).join('')}</select><div class="row" style="gap:4px;flex-wrap:nowrap">${isShotSkill(s)?`<button class="btn sm ${dgHas(it.diagram)?'pri':''}" data-act="dgopen" data-si="${si}" data-ii="${ii}" aria-pressed="${S.dgEdit===si+'-'+ii}">그림</button>`:''}<button class="btn sm" data-act="itdel" data-si="${si}" data-ii="${ii}">삭제</button></div></div>${isShotSkill(s)&&S.dgEdit===si+'-'+ii?dgEditor(it,si,ii):''}`).join('')}

function render(){
  const ae=document.activeElement;const soft=S.softRender;S.softRender=false;
  if(soft&&S.loaded&&ae&&ae.closest&&ae.closest('main')&&/INPUT|TEXTAREA/.test(ae.tagName)){S.pending=true;return}
  if(!S.teamId||!teamOf(S.teamId))S.teamId=S.teams[0]?.id||null;
  let body;
  if(!S.pin)body=pinView();
  else if(!S.loaded)body=`<div class="card empty"><h2>기록을 불러오는 중</h2><p>구글 시트에서 팀, 선수, 평가 기록을 가져오고 있습니다.</p></div>`;
  else body=(S.syncErr?`<div class="banner err" role="alert">서버와 연결이 끊겼습니다. 입력 ${S.queue.length}건을 이 기기에 보관 중이며, 연결되면 자동으로 보냅니다.</div>`:'')+
    (S.kid.on?viewKid():({dash:viewDash,eval:viewEval,result:()=>viewResult(false),rank:viewRank,memo:viewMemo,player:viewPlayer,set:viewSet}[S.tab]||viewEval)());
  const okb=document.getElementById('kbScroll'),kbX=okb?.scrollLeft,kbK=okb?.dataset.k;const ow=document.getElementById('sbWrap'),sbX=ow?.scrollLeft,sbK=ow?.dataset.k+'|'+S.resDate+'|'+S.boardDate;const y=window.scrollY;const chipX=document.querySelector('.chips')?.scrollLeft;
  const kid=S.kid.on&&S.pin;document.getElementById('app').innerHTML=(kid?kidHeader():header())+`<main class="${kid?'kidmode':''} ${!kid&&['eval','result','rank'].includes(S.tab)||kid?'wide':''} ${!kid&&S.cell&&S.tab==='eval'&&S.sessId?'has-sheet':''}">${body}</main>`;
  window.scrollTo(0,y);const nkb=document.getElementById('kbScroll');if(nkb&&kbX&&nkb.dataset.k===kbK)nkb.scrollLeft=kbX;const sw=document.getElementById('sbWrap');if(sw&&sbX&&sw.dataset.k+'|'+S.resDate+'|'+S.boardDate===sbK)sw.scrollLeft=sbX;
  const ch=document.querySelector('.chips');if(ch){const cur=ch.querySelector('[aria-current="true"]');if(chipX!=null)ch.scrollLeft=chipX;if(cur){const l=cur.offsetLeft-ch.offsetLeft;if(l<ch.scrollLeft||l+cur.offsetWidth>ch.scrollLeft+ch.clientWidth)ch.scrollLeft=l-16}}
  if(!S.pin)setTimeout(()=>document.getElementById('pinIn')?.focus(),0)}
function softRender(){S.softRender=true;render()}
document.addEventListener('focusout',()=>{if(S.pending){S.pending=false;setTimeout(()=>{if(!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))render();else S.pending=true},250)}});
async function loadNames(){
  if(!S.user||!S.user.profiles)return;
  const ids=[...new Set(S.records.map(r=>r.by).filter(Boolean))].filter(i=>!(i in S.names));if(!ids.length)return;
  ids.forEach(i=>S.names[i]='');
  try{const ps=await S.user.profiles(ids);ids.forEach(i=>{S.names[i]=ps?.[i]?.name||''})}catch(e){}}

/* ---------- events ---------- */
function curSess(){return sessOf(S.sessId)}
document.addEventListener('input',e=>{const el=e.target,f=el.dataset.f;if(!f)return;
  if(f==='dgnote'){const it=S.skillDraft[+el.dataset.si].items[+el.dataset.ii];it.diagram=Object.assign({on:true,stones:[],zones:{}},it.diagram,{note:el.value.slice(0,60)});return}
  if(f==='dgz'){const it=S.skillDraft[+el.dataset.si].items[+el.dataset.ii];it.diagram=Object.assign({on:true,stones:[],zones:{}},it.diagram);it.diagram.zones={...it.diagram.zones,[el.dataset.k]:el.value.trim().slice(0,4)};return}
  if(f==='ntext')S.noteForm.text=el.value;
  else if(f==='nstitle')S.newSess.title=el.value;
  else if(f==='nsrepin'){const n=Math.max(1,Math.min(30,parseInt(el.value,10)||1));S.newSess.items[el.dataset.i]=n}
  else if(f==='rmemo'){const s=sessOf(el.dataset.s);if(s){getDraft(s,el.dataset.p).memo=el.value;schedule(s,el.dataset.p)}}
  else if(f==='evmemo'){const s=curSess();if(s&&S.evalP){getDraft(s,S.evalP).memo=el.value;schedule(s,S.evalP)}}
  else if(/^sk|^it/.test(f)){const s=S.skillDraft[+el.dataset.si];if(f==='skname')s.name=el.value;if(f==='skshort')s.short=el.value;

  /* settings */
  case 'addteam':{const n=val('newTeam');if(!n){toast('팀 이름을 입력하세요');break}const id=uid('t');if(await put('teams',id,{name:n,createdAt:new Date().toISOString()})){S.teamId=id;toast('팀을 추가했습니다')}break}
  case 'saveteam':{const t=teamOf(v);const n=val('tn_'+v);if(t&&n&&await put('teams',v,{...strip(t),name:n}))toast('저장했습니다');break}
  case 'delteam':if(arm('team:'+v)){for(const p of teamPlayers(v))await put('players',p.id,{...strip(p),teamId:''});await del('teams',v);render()}break;
  case 'addplayer':{const n=val('np_name');if(!n){toast('선수 이름을 입력하세요');break}
    if(await put('players',uid('p'),{name:n,teamId:val('np_team'),position:val('np_pos'),createdAt:new Date().toISOString()})){toast('선수를 추가했습니다');const el=document.getElementById('np_name');if(el){el.value='';el.focus()}}break}
  case 'saveplayer':{const p=playerOf(v);const n=val('pn_'+v);if(p&&n&&await put('players',v,{...strip(p),name:n,teamId:val('pt_'+v),position:val('pp_'+v)}))toast('저장했습니다');break}
  case 'delplayer':if(arm('player:'+v)){await del('players',v);render()}break;
  case 'skadd':S.skillDraft.push({id:uid('k'),name:'새 기능',short:'',items:[{id:uid('i'),name:'',criteria:'',reps:1}]});render();break;
  case 'skdel':S.skillDraft.splice(si,1);render();break;
  case 'skup':{const d=S.skillDraft;[d[si-1],d[si]]=[d[si],d[si-1]];render();break}
  case 'itadd':S.skillDraft[si].items.push({id:uid('i'),name:'',criteria:'',reps:1});render();break;
  case 'itdel':S.skillDraft[si].items.splice(ii,1);render();break;
  case 'skreset':S.skillDraft=clone(DEFAULT_SKILLS);render();toast('기본 항목을 불러왔습니다. 저장을 눌러야 적용됩니다');break;
  case 'sksave':{const d=S.skillDraft.map(s=>({...s,name:s.name.trim()||'이름 없는 기능',short:(s.short||'').trim(),items:s.items.filter(i=>i.name.trim()).map(i=>({...i,name:i.name.trim(),criteria:(i.criteria||'').trim(),reps:i.reps||1}))})).filter(s=>s.items.length);
    if(!d.length){toast('테스트 항목이 하나 이상 있어야 합니다');break}if(await putSkills(d)){S.skills=d;S.skillDraft=null;
      const defs={};d.forEach(sk=>sk.items.forEach(it=>defs[it.id]=mx(it)));let upd=0,kept=0;
      S.sessions.forEach(ss=>{let ch=false;const items=ss.items.map(it=>{const m=defs[it.itemId];if(m==null||m===mx(it))return it;
        const used=sessPlayers(ss).some(p=>(peekAttempts(ss,p.id)[it.itemId]||[]).some(v=>v!=null));if(used){kept++;return it}ch=true;return {...it,max:m}});
        if(ch){upd++;put('sessions',ss.id,{...strip(ss),items})}});
      render();toast('평가 항목을 저장했습니다'+(upd?` · 평가판 ${upd}개 점수 범위 변경`:'')+(kept?' · 점수가 이미 입력된 항목은 기존 범위 유지':''))}break}
  case 'delsample':if(arm('sample')){for(const c of ['records','notes','sessions','players','teams'])for(const x of S[c].filter(x=>x.sample))await del(c,x.id);toast('예시 데이터를 삭제했습니다');render()}break;
  }});
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();toast(ok?'순위표를 복사했습니다. 구글 시트나 엑셀에 붙여 넣으세요':'복사하지 못했습니다. 표를 직접 선택해 복사하세요')}
function strip(o){const c={...o};delete c.id;return c}
window.addEventListener('pagehide',flushAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll()});

/* ---------- boot ---------- */
function boot(){
  try{const q=new URLSearchParams(location.search).get('api');if(q&&/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(q)){lsSet(AKEY,q);history.replaceState(null,'',location.pathname)}}catch(e){}
  S.pin=lsGet(PKEY);if(!IN_GAS&&!apiUrl())S.pin=null;
  if(S.pin){refresh(true);pump()}else{S.loaded=false;render()}
  setInterval(()=>{if(!document.hidden){if(S.queue.length)pump();else refresh()}},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.pin){S.queue.length?pump():refresh()}});
  window.addEventListener('online',()=>pump());
}
render();boot();
})();
</script>
